name: Compilar app de Android

on:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'android/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    name: Generar APK instalable
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: npm ci

      - name: Copiar la app web al proyecto de Android
        run: npx cap sync android

      - name: ¿Hay clave de firma configurada?
        id: firma
        run: echo "hay_clave=${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - name: Restaurar la clave de firma
        if: steps.firma.outputs.hay_clave == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/sueno-bebe.keystore"

      # APK de prueba: se instala directamente en el móvil sin pasar por Google Play.
      - name: Compilar APK de prueba
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}

      # AAB firmado: es lo que pide Google Play. Solo si hay clave configurada.
      - name: Compilar bundle firmado para Google Play
        if: steps.firma.outputs.hay_clave == 'true'
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/sueno-bebe.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Preparar los archivos
        id: archivos
        run: |
          mkdir -p salida
          cp android/app/build/outputs/apk/debug/app-debug.apk "salida/sueno-bebe.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "salida/sueno-bebe-play.aab"
          fi
          ls -la salida
          echo "tamano=$(du -h salida/sueno-bebe.apk | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: app-android
          path: salida/*
          retention-days: 30

      # Publica el APK como descarga directa, para instalarlo desde el móvil.
      - name: Publicar el APK descargable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTAS=$(cat <<EOF
          ### 📱 Instalar Sueño Bebé en un móvil Android

          1. Abre esta página **desde el móvil** y descarga \`sueno-bebe.apk\`.
          2. Ábrelo. Android pedirá permiso para instalar apps de esta procedencia: acéptalo.
          3. Listo. Se instala como cualquier otra app.

          La primera vez que abras el recordatorio de rutina, acepta el permiso de notificaciones.

          ---

          Compilación **$(date '+%d/%m/%Y a las %H:%M')** · versión 1.0.${{ github.run_number }} · ${{ steps.archivos.outputs.tamano }} · commit \`${{ github.sha }}\`

          Es una compilación de prueba firmada con la clave de depuración, pensada para instalarla directamente. Si más adelante se publica en Google Play, habrá que desinstalar esta antes de instalar la de la tienda (las firmas son distintas).
          EOF
          )
          if gh release view app-android >/dev/null 2>&1; then
            gh release upload app-android salida/sueno-bebe.apk --clobber
            gh release edit app-android --notes "$NOTAS" --title "📱 App de Android (última compilación)"
          else
            gh release create app-android salida/sueno-bebe.apk \
              --title "📱 App de Android (última compilación)" \
              --notes "$NOTAS" \
              --latest=false
          fi

      - name: Resumen
        run: |
          {
            echo "## ✅ App de Android compilada"
            echo ""
            echo "Descárgala desde **[la página de versiones](${{ github.server_url }}/${{ github.repository }}/releases/tag/app-android)** abriendo el enlace en el móvil."
            echo ""
            echo "- Versión: \`1.0.${{ github.run_number }}\`"
            echo "- Tamaño: ${{ steps.archivos.outputs.tamano }}"
            if [ "${{ steps.firma.outputs.hay_clave }}" = "true" ]; then
              echo "- Bundle firmado para Google Play: en los artefactos de esta ejecución"
            else
              echo "- Para Google Play falta configurar la clave de firma (ver README)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
